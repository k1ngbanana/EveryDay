<script>
  let activeEffect = null
  class Dep {
    subscribers = new Set()

    depend() {
      if (activeEffect) {
        this.subscribers.add(activeEffect)
      }
    }

    notify() {
      this.subscribers.forEach(effect => effect())
    }
  }

  function watchEffect(effect) {
    activeEffect = effect
    effect()
    activeEffect = null
  }

  function reactive(raw) {
    for (const key in raw) {
      let _value = raw[key]
      const dep = new Dep()
      Object.defineProperty(raw, key, {
        get() {
          dep.depend()
          return _value
        },
        set(value) {
          _value = value
          dep.notify()
          // return true
        }
      })
    }

    return raw
  }

  const state = reactive({ a: 1 })

  watchEffect(() => {
    console.log(state.a)
  })

  state.a = 'banana'
  state.b = 'world'
</script>
